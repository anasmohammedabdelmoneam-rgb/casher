<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>التقارير | Jaguar POS</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Cairo,sans-serif;
}

body{
background:#eef3fa;
padding:40px;
}

.container{
max-width:1200px;
margin:auto;
}

.title{
font-size:34px;
font-weight:bold;
color:#2563eb;
margin-bottom:30px;
}

.cards{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;

}

.card{

background:white;
border-radius:18px;
padding:25px;
box-shadow:0 8px 25px rgba(0,0,0,.08);

}

.card h2{

font-size:18px;
color:#666;

}

.value{

margin-top:15px;
font-size:34px;
font-weight:bold;
color:#2563eb;

}

.back{

margin-top:40px;
padding:14px 25px;
background:#2563eb;
color:white;
border:none;
border-radius:12px;
cursor:pointer;
font-size:16px;

}

.back:hover{

background:#1d4ed8;

}

</style>

</head>

<body>

<div class="container">

<div class="title">

📊 التقارير

</div>

<div class="cards">

<div class="card">

<h2>مبيعات اليوم</h2>

<div class="value">

2,540 ج.م

</div>

</div>

<div class="card">

<h2>عدد الفواتير</h2>

<div class="value">

35

</div>

</div>

<div class="card">

<h2>أفضل منتج</h2>

<div class="value">

كوكاكولا

</div>

</div>

<div class="card">

<h2>إجمالي الأرباح</h2>

<div class="value">

18,300 ج.م

</div>

</div>

</div>

<button
class="back"
onclick="location.href='index.html'">

⬅ العودة للكاشير

</button>

</div>

</body>

</html>
