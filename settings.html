<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jaguar POS | الإعدادات</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Cairo,sans-serif;
}

body{
background:#eef3fa;
}

.header{
background:#111827;
color:#fff;
padding:20px 30px;
font-size:28px;
font-weight:800;
}

.container{
padding:30px;
}

.card{
background:#fff;
border-radius:18px;
padding:25px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
max-width:700px;
}

h2{
margin-bottom:20px;
}

.item{
margin-bottom:20px;
}

label{
display:block;
margin-bottom:8px;
font-weight:bold;
}

input,
select{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
}

button{
margin-top:20px;
padding:14px 25px;
border:none;
background:#2563eb;
color:white;
border-radius:12px;
cursor:pointer;
font-size:16px;
font-weight:bold;
}

button:hover{
background:#1d4ed8;
}

.back{
display:inline-block;
margin-top:25px;
text-decoration:none;
background:#111827;
color:white;
padding:12px 20px;
border-radius:12px;
}

</style>
</head>

<body>

<div class="header">
⚙️ إعدادات Jaguar POS
</div>

<div class="container">

<div class="card">

<h2>الإعدادات العامة</h2>

<div class="item">
<label>اسم المتجر</label>
<input type="text" value="Jaguar Store">
</div>

<div class="item">
<label>العملة</label>
<select>
<option>جنيه مصري</option>
<option>ريال سعودي</option>
<option>دولار</option>
</select>
</div>

<div class="item">
<label>اللغة</label>
<select>
<option>العربية</option>
<option>English</option>
</select>
</div>

<button onclick="alert('تم حفظ الإعدادات')">
حفظ الإعدادات
</button>

<br>

<a href="index.html" class="back">
⬅ العودة للرئيسية
</a>

</div>

</div>

</body>
</html>
