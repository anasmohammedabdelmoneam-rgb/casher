<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>المخزون | Jaguar POS</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Cairo,sans-serif;
}

body{
background:#eef3fa;
padding:40px;
}

.container{

max-width:1200px;
margin:auto;

}

.card{

background:#fff;
padding:30px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.08);

}

h1{

margin-bottom:25px;
color:#2563eb;

}

table{

width:100%;
border-collapse:collapse;

}

th,td{

padding:15px;
border-bottom:1px solid #eee;
text-align:center;

}

th{

background:#2563eb;
color:white;

}

.low{

color:red;
font-weight:bold;

}

.good{

color:green;
font-weight:bold;

}

button{

margin-top:25px;
padding:12px 22px;
background:#2563eb;
border:none;
color:white;
border-radius:10px;
cursor:pointer;

}

button:hover{

background:#1d4ed8;

}
  .modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.modal-content{
    width:400px;
    background:#fff;
    border-radius:20px;
    padding:25px;
    display:flex;
    flex-direction:column;
    gap:15px;
}

.modal-content input{
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
}

.modal-content button{
    padding:12px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}

.modal-content button:first-of-type{
    background:#22c55e;
    color:#fff;
}

.modal-content button:last-of-type{
    background:#ef4444;
    color:#fff;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>إدارة المخزون</h1>

<table>

<tr>

<th>المنتج</th>
<th>المتوفر</th>
<th>الحالة</th>

</tr>

<tr>

<td>كوكاكولا</td>
<td>25</td>
<td class="good">متوفر</td>

</tr>

<tr>

<td>بيبسي</td>
<td>4</td>
<td class="low">منخفض</td>

</tr>

<tr>

<td>مياه</td>
<td>60</td>
<td class="good">متوفر</td>

</tr>

<tr>

<td>شيبسي</td>
<td>8</td>
<td class="low">منخفض</td>

</tr>

</table>

<button onclick="location.href='index.html'">

⬅ العودة للكاشير

</button>
  <button onclick="openAddStock()">
    ➕ إضافة مخزون جديد
</button>

</div>

</div>
  <div id="stockModal" class="modal">

<div class="modal-content">

<h2>إضافة منتج للمخزون</h2>

<input id="stockName" placeholder="اسم المنتج">

<input id="stockPrice" type="number" placeholder="السعر">

<input id="stockQty" type="number" placeholder="الكمية">

<button onclick="saveStock()">
حفظ
</button>

<button onclick="closeAddStock()">
إلغاء
</button>

</div>

</div>
  <script>

function openAddStock(){
    document.getElementById("stockModal").style.display = "flex";
}

function closeAddStock(){
    document.getElementById("stockModal").style.display = "none";
}

function saveStock(){

    const name = document.getElementById("stockName").value;
    const price = document.getElementById("stockPrice").value;
    const qty = document.getElementById("stockQty").value;

    if(name==="" || price==="" || qty===""){
        alert("يرجى إدخال جميع البيانات");
        return;
    }

    const table = document.querySelector("table");

    const row = table.insertRow(-1);

    row.innerHTML = `
        <td>${name}</td>
        <td>${qty}</td>
        <td class="${qty<=10?'low':'good'}">
            ${qty<=10?'منخفض':'متوفر'}
        </td>
    `;

    document.getElementById("stockName").value="";
    document.getElementById("stockPrice").value="";
    document.getElementById("stockQty").value="";

    closeAddStock();

    alert("تمت إضافة المنتج للمخزون بنجاح");

}

window.onclick=function(e){

    const modal=document.getElementById("stockModal");

    if(e.target===modal){
        closeAddStock();
    }

}

</script>

</body>

</html>
