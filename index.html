<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Jaguar POS</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Cairo",sans-serif;
}

html,body{
width:100%;
height:100%;
background:#eef3fa;
overflow:hidden;
color:#222;
}

.app{
display:flex;
width:100%;
height:100vh;
}

/*========================
Sidebar
========================*/

.sidebar{

width:260px;
background:#111827;
color:#fff;

display:flex;
flex-direction:column;

padding:25px;

box-shadow:5px 0 20px rgba(0,0,0,.15);

}

.logo{

font-size:28px;
font-weight:800;

display:flex;
align-items:center;
justify-content:center;

gap:10px;

margin-bottom:35px;

color:#3b82f6;

}

.nav-btn{

border:none;
background:none;

color:#d1d5db;

padding:16px;

margin-bottom:10px;

border-radius:14px;

cursor:pointer;

font-size:17px;

text-align:right;

transition:.25s;

width:100%;

}

.nav-btn:hover{

background:#1f2937;

color:white;

}

.nav-btn.active{

background:#2563eb;

color:white;

}

/*========================
Main
========================*/

.main{

flex:1;

display:flex;

flex-direction:column;

overflow:hidden;

}

/*========================
Topbar
========================*/

.topbar{

height:80px;

background:white;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 25px;

box-shadow:0 5px 20px rgba(0,0,0,.05);

}

#pageTitle{

font-size:28px;

color:#2563eb;

font-weight:800;

}

/*========================
Pages
========================*/

.page{

flex:1;

padding:25px;

overflow:auto;

}

/*========================
Cards
========================*/

.card{

background:white;

border-radius:20px;

padding:25px;

box-shadow:0 10px 30px rgba(0,0,0,.06);

margin-bottom:20px;

}

.card-title{

font-size:22px;

font-weight:bold;

margin-bottom:20px;

}

/*========================
Buttons
========================*/

button{

cursor:pointer;

border:none;

transition:.25s;

}

.primary{

background:#2563eb;

color:white;

padding:12px 20px;

border-radius:10px;

}

.primary:hover{

background:#1d4ed8;

}

.success{

background:#22c55e;

color:white;

padding:12px 20px;

border-radius:10px;

}

.success:hover{

background:#16a34a;

}

.danger{

background:#ef4444;

color:white;

padding:12px 20px;

border-radius:10px;

}

.danger:hover{

background:#dc2626;

}

/*========================
Inputs
========================*/

input,
select,
textarea{

width:100%;

padding:12px;

border:1px solid #ddd;

border-radius:12px;

outline:none;

font-size:15px;

margin-bottom:15px;

}

input:focus{

border-color:#2563eb;

}

/*========================
Tables
========================*/

table{

width:100%;

border-collapse:collapse;

background:white;

}

th{

background:#2563eb;

color:white;

padding:15px;

}

td{

padding:15px;

text-align:center;

border-bottom:1px solid #eee;

}

/*========================
Modal
========================*/

.modal{

display:none;

position:fixed;

inset:0;

background:rgba(0,0,0,.45);

justify-content:center;

align-items:center;

z-index:9999;

}

.modal-content{

width:420px;

background:white;

padding:25px;

border-radius:20px;

display:flex;

flex-direction:column;

gap:15px;

animation:popup .25s;

}

@keyframes popup{

from{

transform:scale(.9);

opacity:0;

}

to{

transform:scale(1);

opacity:1;

}

}

/*========================
Responsive
========================*/

@media(max-width:900px){

.sidebar{

display:none;

}

.main{

width:100%;

}

}التالي
.content{

display:grid;

grid-template-columns:1fr 380px;

gap:20px;

height:100%;

}

.products{

overflow:auto;

}

.cart{

overflow:auto;

}

.product-grid{

display:grid;

grid-template-columns:repeat(auto-fill,minmax(180px,1fr));

gap:18px;

margin-top:20px;

}

.product-card{

background:white;

border-radius:18px;

padding:15px;

cursor:pointer;

box-shadow:0 8px 20px rgba(0,0,0,.06);

transition:.25s;

}

.product-card:hover{

transform:translateY(-5px);

}

.product-card img{

width:100%;

height:160px;

object-fit:cover;

border-radius:12px;

}

.product-name{

font-size:18px;

font-weight:bold;

margin-top:10px;

}

.product-price{

color:#2563eb;

font-weight:bold;

margin-top:8px;

font-size:18px;

}

.cart-item{

display:flex;

justify-content:space-between;

align-items:center;

padding:12px 0;

border-bottom:1px solid #eee;

}

.empty{

text-align:center;

color:#888;

padding:40px;

}
</style>

</head>

<body>

<div class="app">

    <!-- القائمة الجانبية -->

    <aside class="sidebar">

        <div class="logo">

            <i class="fa-solid fa-cash-register"></i>

            Jaguar POS

        </div>

        <button class="nav-btn active"
        onclick="showPage('cashier')">

            <i class="fa-solid fa-cart-shopping"></i>

            الكاشير

        </button>

        <button class="nav-btn"
        onclick="showPage('products')">

            <i class="fa-solid fa-box"></i>

            المنتجات

        </button>

        <button class="nav-btn"
        onclick="showPage('inventory')">

            <i class="fa-solid fa-warehouse"></i>

            المخزون

        </button>

        <button class="nav-btn"
        onclick="showPage('reports')">

            <i class="fa-solid fa-chart-line"></i>

            التقارير

        </button>

        <button class="nav-btn"
        onclick="showPage('settings')">

            <i class="fa-solid fa-gear"></i>

            الإعدادات

        </button>

    </aside>

    <!-- المحتوى -->

    <main class="main">

        <header class="topbar">

            <h2 id="pageTitle">

                الكاشير

            </h2>

        </header>

        <!-- صفحة الكاشير -->

        <section id="cashierPage" class="page">

<div class="content">

<div class="products">

<div class="card">

<h2 class="card-title">
المنتجات
</h2>

<input
type="text"
id="searchInput"
placeholder="ابحث عن منتج...">

<div id="productGrid"
class="product-grid">

</div>

</div>

</div>

<div class="cart">

<div class="card">

<h2 class="card-title">
الفاتورة
</h2>

<div
id="cartItems">

<p class="empty">

لا توجد منتجات.

</p>

</div>

<hr style="margin:20px 0;">

<div
style="
display:flex;
justify-content:space-between;
margin-bottom:10px;
">

<span>

عدد المنتجات

</span>

<strong
id="itemsCount">

0

</strong>

</div>

<div
style="
display:flex;
justify-content:space-between;
margin-bottom:20px;
">

<span>

الإجمالي

</span>

<strong
id="totalPrice">

0.00 ج.م

</strong>

</div>

<button
class="success"
id="payBtn"
style="width:100%;">

💳 إتمام الدفع

</button>

<button
class="primary"
id="printBtn"
style="
width:100%;
margin-top:10px;
">

🖨️ طباعة الفاتورة

</button>

</div>

</div>

</div>

</section>

<section id="inventoryPage" class="page" style="display:none;">

<div class="card">

<h2 class="card-title">إدارة المخزون</h2>

<button class="success" onclick="openAddStock()">
➕ إضافة مخزون جديد
</button>

<br><br>

<table>

<thead>

<tr>
<th>المنتج</th>
<th>السعر</th>
<th>الكمية</th>
<th>الحالة</th>
</tr>

</thead>

<tbody id="stockTable">

</tbody>

</table>

</div>

<div id="stockModal" class="modal">

<div class="modal-content">

<h2>إضافة منتج</h2>

<input id="stockName" placeholder="اسم المنتج">

<input id="stockPrice" type="number" placeholder="السعر">

<input id="stockQty" type="number" placeholder="الكمية">

<input id="stockImage" placeholder="رابط الصورة">

<button class="success" onclick="saveStock()">
حفظ
</button>

<button class="danger" onclick="closeAddStock()">
إلغاء
</button>

</div>

</div>

</section>
        <!-- صفحة المنتجات -->

      <section
id="productsPage"
class="page"
style="display:none;">

<div class="card">

<h2 class="card-title">

إدارة المنتجات

</h2>

<input
id="productName"
placeholder="اسم المنتج">

<input
id="productPrice"
type="number"
placeholder="السعر">

<input
id="productImage"
placeholder="رابط الصورة">

<button
class="success"
onclick="saveProduct()">

➕ إضافة المنتج

</button>

<hr style="margin:20px 0;">

<table>

<thead>

<tr>

<th>الصورة</th>
<th>الاسم</th>
<th>السعر</th>
<th>الإجراءات</th>

</tr>

</thead>

<tbody id="productsTable">

</tbody>

</table>

</div>

</section>

        <!-- صفحة المخزون -->
<!-- صفحة المخزون -->

<section id="inventoryPage" class="page" style="display:none;">

<div class="card">

<h2 class="card-title">
إدارة المخزون
</h2>

<button class="success" onclick="openAddStock()">
➕ إضافة مخزون جديد
</button>

<br><br>

<table>

<thead>
<tr>
<th>المنتج</th>
<th>السعر</th>
<th>الكمية</th>
<th>الحالة</th>
</tr>
</thead>

<tbody id="stockTable">

</tbody>

</table>

</div>


<div id="stockModal" class="modal">

<div class="modal-content">

<h2>
إضافة منتج للمخزون
</h2>

<input id="stockName" placeholder="اسم المنتج">

<input id="stockPrice" type="number" placeholder="السعر">

<input id="stockQty" type="number" placeholder="الكمية">

<input id="stockImage" placeholder="رابط الصورة">

<button class="success" onclick="saveStock()">
حفظ
</button>

<button class="danger" onclick="closeAddStock()">
إلغاء
</button>

</div>

</div>


</section>
      

        <!-- صفحة التقارير -->

        <section
        id="reportsPage"
        class="page"
        style="display:none;">

        </section>

        <!-- صفحة الإعدادات -->

        <section
        id="settingsPage"
        class="page"
        style="display:none;">

        </section>

    </main>

</div>

<script>

/*==================================
إعداد المنتجات
==================================*/

let products = JSON.parse(localStorage.getItem("products")) || [

{
id:1,
name:"كوكاكولا",
price:15,
image:"https://images.unsplash.com/photo-1629203851122-3726ecdf080e?w=400"
},

{
id:2,
name:"بيبسي",
price:18,
image:"https://images.unsplash.com/photo-1581006852262-e4307cf6283a?w=400"
},

{
id:3,
name:"مياه",
price:5,
image:"https://images.unsplash.com/photo-1564419320408-38e24e038739?w=400"
}

];

localStorage.setItem(
"products",
JSON.stringify(products)
);

/*==================================
العناصر
==================================*/

const productGrid =
document.getElementById("productGrid");

const searchInput =
document.getElementById("searchInput");

const cartItems =
document.getElementById("cartItems");

const itemsCount =
document.getElementById("itemsCount");

const totalPrice =
document.getElementById("totalPrice");

/*==================================
السلة
==================================*/

let cart=[];

/*==================================
عرض المنتجات
==================================*/

function renderProducts(list){

productGrid.innerHTML="";

list.forEach(product=>{

productGrid.innerHTML+=`

<div class="product-card"
onclick="addToCart(${product.id})">

<img src="${product.image}">

<div class="product-name">

${product.name}

</div>

<div class="product-price">

${product.price} ج.م

</div>

</div>

`;

});

}

renderProducts(products);

/*==================================
البحث
==================================*/

searchInput.oninput=()=>{

const value =
searchInput.value.toLowerCase();

const filtered =
products.filter(product=>

product.name
.toLowerCase()
.includes(value)

);

renderProducts(filtered);

};
    /*==================================
إضافة منتج للسلة
==================================*/

function addToCart(id){

const product=products.find(p=>p.id===id);

if(!product) return;

const existing=cart.find(p=>p.id===id);

if(existing){

existing.qty++;

}else{

cart.push({

...product,

qty:1

});

}

updateCart();

}

/*==================================
تحديث السلة
==================================*/

function updateCart(){

cartItems.innerHTML="";

if(cart.length===0){

cartItems.innerHTML=`

<p class="empty">

لا توجد منتجات.

</p>

`;

itemsCount.textContent=0;

totalPrice.textContent="0.00 ج.م";

return;

}

let total=0;
let count=0;

cart.forEach(item=>{

total+=item.price*item.qty;

count+=item.qty;

cartItems.innerHTML+=`

<div class="cart-item">

<div>

<strong>${item.name}</strong>

<br>

${item.price} ج.م

</div>

<div style="display:flex;gap:8px;align-items:center;">

<button
onclick="decreaseQty(${item.id})">

−

</button>

<strong>

${item.qty}

</strong>

<button
onclick="increaseQty(${item.id})">

+

</button>

</div>

<strong>

${(item.price*item.qty).toFixed(2)} ج.م

</strong>

<button
onclick="removeItem(${item.id})">

🗑️

</button>

</div>

`;

});

itemsCount.textContent=count;

totalPrice.textContent=

total.toFixed(2)+" ج.م";

}

/*==================================
زيادة الكمية
==================================*/

function increaseQty(id){

const item=

cart.find(p=>p.id===id);

if(item){

item.qty++;

updateCart();

}

}

/*==================================
إنقاص الكمية
==================================*/

function decreaseQty(id){

const item=

cart.find(p=>p.id===id);

if(!item) return;

item.qty--;

if(item.qty<=0){

removeItem(id);

return;

}

updateCart();

}

/*==================================
حذف منتج
==================================*/

function removeItem(id){

cart=

cart.filter(p=>p.id!==id);

updateCart();

}

/*==================================
إتمام الدفع
==================================*/

document
.getElementById("payBtn")
.onclick=function(){

if(cart.length===0){

alert("الفاتورة فارغة");

return;

}

alert(

"✅ تمت عملية البيع بنجاح"

);

cart=[];

updateCart();

};

/*==================================
طباعة الفاتورة
==================================*/

document
.getElementById("printBtn")
.onclick=function(){

window.print();

};
    /*==================================
عرض جدول المنتجات
==================================*/

function renderProductsTable(){

const table=
document.getElementById("productsTable");

table.innerHTML="";

products.forEach(product=>{

table.innerHTML+=`

<tr>

<td>

<img
src="${product.image}"
style="
width:60px;
height:60px;
object-fit:cover;
border-radius:10px;
">

</td>

<td>

${product.name}

</td>

<td>

${product.price} ج.م

</td>

<td>

<button
class="danger"
onclick="deleteProduct(${product.id})">

حذف

</button>

</td>

</tr>

`;

});

}

/*==================================
إضافة منتج
==================================*/

function saveProduct(){

const name=
document.getElementById("productName").value.trim();

const price=
Number(document.getElementById("productPrice").value);

const image=
document.getElementById("productImage").value.trim();

if(!name||!price||!image){

alert("أكمل جميع البيانات");

return;

}

products.push({

id:Date.now(),

name,

price,

image

});

localStorage.setItem(
"products",
JSON.stringify(products)
);

renderProducts(products);

renderProductsTable();

document.getElementById("productName").value="";
document.getElementById("productPrice").value="";
document.getElementById("productImage").value="";

}

/*==================================
حذف منتج
==================================*/

function deleteProduct(id){

if(!confirm("هل تريد حذف المنتج؟")) return;

products=
products.filter(p=>p.id!==id);

localStorage.setItem(
"products",
JSON.stringify(products)
);

renderProducts(products);

renderProductsTable();

}

renderProductsTable();
/*==========================
التنقل بين الصفحات
==========================*/

function showPage(page){

document.querySelectorAll(".page").forEach(p=>{
    p.style.display="none";
});

document.querySelectorAll(".nav-btn").forEach(btn=>{
    btn.classList.remove("active");
});

if(page==="cashier"){
    document.getElementById("cashierPage").style.display="block";
    document.getElementById("pageTitle").textContent="الكاشير";
}

if(page==="products"){
    document.getElementById("productsPage").style.display="block";
    document.getElementById("pageTitle").textContent="المنتجات";
}

if(page==="inventory"){
    document.getElementById("inventoryPage").style.display="block";
    document.getElementById("pageTitle").textContent="المخزون";
}

if(page==="reports"){
    document.getElementById("reportsPage").style.display="block";
    document.getElementById("pageTitle").textContent="التقارير";
}

if(page==="settings"){
    document.getElementById("settingsPage").style.display="block";
    document.getElementById("pageTitle").textContent="الإعدادات";
}

document.querySelectorAll(".nav-btn").forEach(btn=>{
    btn.classList.remove("active");
});

document.querySelector(`button[onclick="showPage('${page}')"]`)?.classList.add("active");
}

/*==========================
المخزون
==========================*/

let stock =
JSON.parse(localStorage.getItem("stock")) || [];

/*==========================
عرض المخزون
==========================*/

function renderStock(){

const table =
document.getElementById("stockTable");

if(!table) return;

table.innerHTML="";

stock.forEach(item=>{

table.innerHTML+=`
<tr>
<td>${item.name}</td>
<td>${item.price} ج.م</td>
<td>${item.qty}</td>
<td>${item.qty<=5 ? "منخفض" : "متوفر"}</td>
</tr>
`;

});

}

/*==========================
فتح النافذة
==========================*/

function openAddStock(){

document.getElementById("stockModal").style.display="flex";

}

/*==========================
إغلاق النافذة
==========================*/

function closeAddStock(){

document.getElementById("stockModal").style.display="none";

}

/*==========================
حفظ المنتج
==========================*/

function saveStock(){

const name=document.getElementById("stockName").value.trim();
const price=Number(document.getElementById("stockPrice").value);
const qty=Number(document.getElementById("stockQty").value);
const image=document.getElementById("stockImage").value.trim();

if(!name||!price||!qty||!image){

alert("أكمل جميع البيانات");

return;

}

stock.push({
id:Date.now(),
name,
price,
qty,
image
});

products.push({
id:Date.now()+1,
name,
price,
image
});

localStorage.setItem("stock",JSON.stringify(stock));
localStorage.setItem("products",JSON.stringify(products));

renderStock();
renderProducts(products);
renderProductsTable();

closeAddStock();

}

renderStock();

</script>

</body>

</html>
