<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المنتجات | Jaguar POS</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:Cairo,sans-serif;
    background:#eef3fa;
}
.container{
    max-width:1100px;
    margin:auto;
    padding:40px;
}
.card{
    background:#fff;
    padding:30px;
    border-radius:20px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
}
h1{
    color:#2563eb;
}
input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    border:1px solid #ddd;
}
button{
    background:#2563eb;
    color:#fff;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
}
table{
    width:100%;
    margin-top:20px;
    border-collapse:collapse;
}
th,td{
    padding:12px;
    border-bottom:1px solid #eee;
    text-align:center;
}
</style>

</head>
<body>

<div class="container">

<div class="card">

<h1>إدارة المنتجات</h1>

<input placeholder="اسم المنتج">

<input placeholder="السعر">

<input placeholder="رابط الصورة">

<button>إضافة منتج</button>

<table>

<tr>

<th>الصورة</th>

<th>الاسم</th>

<th>السعر</th>

<th>إجراء</th>

</tr>

</table>

<br>

<button onclick="location.href='index.html'">
⬅ العودة للكاشير
</button>

</div>

</div>

</body>
</html>
